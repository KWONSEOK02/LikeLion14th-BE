name: KWONSEOK02 EC2 배포

# KWONSEOK02 또는 main 브랜치에 push 발생 시 자동 배포
on:
  push:
    branches:
      - KWONSEOK02
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: kwonseok02/likelion14th-be
  EC2_SSH_USER: ubuntu

jobs:
  build-and-push-to-docker-hub:
    name: Docker 이미지 빌드 후 Docker Hub 푸시
    runs-on: ubuntu-latest

    steps:
      - name: Git에 push한 내용 가져오기
        uses: actions/checkout@v4

      - name: JDK 21 설치하기 (temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: Gradle로 bootJar 빌드 (테스트 제외)
        run: ./gradlew clean bootJar -x test

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시 (latest + SHA 태그)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: EC2에 배포
    needs: build-and-push-to-docker-hub
    runs-on: ubuntu-latest

    steps:
      - name: Git에 push한 내용 가져오기
        uses: actions/checkout@v4

      - name: docker-compose.yml을 EC2로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu"

      - name: EC2 SSH 접속 후 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu

            # 1. .env 파일 생성 (GitHub Secrets ENV 통째 주입)
            cat > .env <<'EOF'
            ${{ secrets.ENV }}
            EOF

            # 2. Docker Hub 로그인 (private 리포 대비)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 3. 최신 이미지 pull
            docker compose pull

            # 4. 컨테이너 재시작 (mysql + redis healthcheck 대기 후 app 기동)
            docker compose up -d

            # 5. 사용 안 하는 이미지 정리
            docker image prune -f

            # 6. 컨테이너 상태 출력
            docker compose ps
